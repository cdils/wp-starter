# Reusable build-and-deploy pipeline for SFTP-only hosts.
#
# Host: {{HOST_LABEL}}
#
# Ships wp-content only. Core on the server is not managed by Composer here.

name: Build & Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      url:
        required: true
        type: string
    secrets:
      SFTP_HOST:
        required: true
      SFTP_USER:
        required: true
      SFTP_PASSWORD:
        required: true
      SFTP_PATH:
        required: true
      COMPOSER_AUTH_JSON:
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: {{ACTION_CHECKOUT}}
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: {{ACTION_TRUFFLEHOG}}
        with:
          extra_args: --only-verified

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: secrets-scan
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    steps:
      # required: true only checks the secret is passed, not that it has a value.
      - name: Check secrets
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PATH" ]; then
            echo "::error::SFTP_HOST, SFTP_USER or SFTP_PATH is empty for this environment - refusing to deploy."
            exit 1
          fi

{{BUILD_STEPS}}

      - name: Assemble release
        run: |
          set -euo pipefail
          mkdir deploy
          cp -R wp-content/. deploy/
          rm -rf deploy/uploads

          find deploy -type d \( -name .git -o -name .github -o -name tests -o -name node_modules \) \
            -prune -exec rm -rf {} +
          find deploy \( -name '.env' -o -name '.env.*' -o -name 'id_rsa*' -o -name '*.pem' -o -name 'auth.json' \) -delete

      # sync: full mirrors deletions, so everything the host owns is excluded.
      # mu-plugins is excluded whole: managed hosts keep their own plugins there.
      - name: Deploy via SFTP
        uses: {{ACTION_SFTP}}
        with:
          remote-protocol: sftp
          remote-host: ${{ secrets.SFTP_HOST }}
          remote-port: {{SSH_PORT}}
          remote-user: ${{ secrets.SFTP_USER }}
          remote-password: ${{ secrets.SFTP_PASSWORD }}
          local-path: deploy
          remote-path: ${{ secrets.SFTP_PATH }}
          sync: full
          ftp-mirror-options: --exclude='^uploads/' --exclude='^cache/' --exclude='^upgrade/' --exclude='^upgrade-temp-backup/' --exclude='^mu-plugins/' --exclude='^languages/'{{WP_CONTENT_EXCLUDE_MIRROR}}
