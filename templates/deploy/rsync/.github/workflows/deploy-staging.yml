# Staging. All the work happens in deploy.yml; this only says which environment.
# Secrets use the same names as production, set on the `staging` environment.

name: Deploy staging

on:
  push:
    branches: [{{STAGING_BRANCH}}]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse the rsync without writing to the server'
        type: boolean
        default: false

jobs:
  deploy:
    # Off until the DEPLOY_ENABLED repository variable is true, so the first push can't deploy.
    # A dry run works before that.
    if: vars.DEPLOY_ENABLED == 'true' || inputs.dry_run == true
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      url: {{STAGING_URL}}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PATH: ${{ secrets.SSH_PATH }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
