name: Deploy staging

on:
  push:
    branches: [{{STAGING_BRANCH}}]
  workflow_dispatch:

jobs:
  deploy:
    # Off until the DEPLOY_ENABLED repository variable is true, so the first push can't deploy.
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      url: {{STAGING_URL}}
      wpe_env: {{WPE_ENV_STAGING}}
    secrets:
      WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
