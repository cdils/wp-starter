# Reusable build-and-deploy pipeline for WP Engine, using WP Engine's official action.
#
# wpe_env is the install name, not a secret. FLAGS replace the action's defaults, so
# -azvr must stay. Platform and cache plugins in mu-plugins are protected from --delete.

name: Build & Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      url:
        required: true
        type: string
      wpe_env:
        description: 'WP Engine install name'
        required: true
        type: string
    secrets:
      WPE_SSHG_KEY_PRIVATE:
        required: true
      COMPOSER_AUTH_JSON:
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: {{ACTION_CHECKOUT}}
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: {{ACTION_TRUFFLEHOG}}
        with:
          extra_args: --only-verified

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: secrets-scan
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    steps:
{{BUILD_STEPS}}

      - name: Assemble release (flat WordPress layout)
        run: |
          set -euo pipefail
          rm -rf cms/wp-content
          mv wp-content cms/wp-content
          rm -rf cms/wp-content/uploads
          rm -f cms/composer.json

          find cms -type d \( -name .git -o -name .github -o -name tests -o -name __tests__ -o -name node_modules \) \
            -prune -exec rm -rf {} +
          find cms \( -name '.env' -o -name '.env.*' -o -name 'id_rsa*' -o -name '*.pem' -o -name 'auth.json' \) -delete

      - name: Deploy to WP Engine
        uses: {{ACTION_WPE}}
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ inputs.wpe_env }}
          SRC_PATH: "cms/"
          FLAGS: -azvr --delete --filter='protect wp-content/mu-plugins/***' --exclude=wp-config.php --exclude=.htaccess --exclude=wp-content/uploads/ --exclude=wp-content/cache/{{WP_CONTENT_EXCLUDE_WPE}}{{ROOT_EXCLUDE_WPE}}
          CACHE_CLEAR: TRUE
